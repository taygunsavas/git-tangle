name: tangle-release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make executables
        run: chmod +x bin/git-tangle libexec/tangle/*.sh scripts/*.sh || true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Derive version from tag
        id: v
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          REQUIRE_WINDOWS_SHIM_EXE: "true"
        run: scripts/package.sh "${{ steps.v.outputs.tag }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz.sha256
            dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip
            dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip.sha256

  windows-security-gate:
    needs: build-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Derive version from tag
        id: v
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF}".Replace("refs/tags/", "")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate winget manifests
        shell: pwsh
        run: |
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash not found on runner." }
          $sha = ((Get-Content "dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip.sha256") -split ' ')[0]
          & $bash -lc "./scripts/generate-winget-manifests.sh ${{ steps.v.outputs.tag }} $env:GITHUB_REPOSITORY $sha ."

      - name: Validate winget manifests
        shell: pwsh
        run: |
          $wg = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe"
          if (!(Test-Path $wg)) { throw "winget.exe not found." }
          $manifest = ".\manifests\t\taygunsavas\git-tangle\${{ steps.v.outputs.tag }}"
          & $wg validate --manifest $manifest --verbose-logs
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit code $LASTEXITCODE" }

      - name: Run Windows Defender security scan
        shell: pwsh
        run: |
          $zip = Resolve-Path "dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip"
          $scanRoot = Join-Path $env:RUNNER_TEMP "git-tangle-security-${{ steps.v.outputs.tag }}"
          if (Test-Path $scanRoot) { Remove-Item -Recurse -Force $scanRoot }
          New-Item -ItemType Directory -Path $scanRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $scanRoot -Force

          $exe = Join-Path $scanRoot "git-tangle.exe"
          if (!(Test-Path $exe)) { throw "Expected launcher not found in zip: $exe" }

          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (!(Test-Path $mp)) {
            $mp = "$env:ProgramFiles(x86)\Windows Defender\MpCmdRun.exe"
          }
          if (!(Test-Path $mp)) { throw "MpCmdRun.exe not found on runner." }

          & $mp -Scan -ScanType 3 -File "$zip"
          if ($LASTEXITCODE -ne 0) { throw "Defender scan failed for ZIP. Exit code: $LASTEXITCODE" }

          & $mp -Scan -ScanType 3 -File "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Defender scan failed for launcher EXE. Exit code: $LASTEXITCODE" }

      - name: Smoke test WinGet Links launcher
        shell: pwsh
        run: |
          $zip = Resolve-Path "dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip"
          $wingetRoot = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet"
          $packagesRoot = Join-Path $wingetRoot "Packages"
          $linksRoot = Join-Path $wingetRoot "Links"
          $pkgRoot = Join-Path $packagesRoot "taygunsavas.git-tangle__DefaultSource"

          if (Test-Path $pkgRoot) { Remove-Item -Recurse -Force $pkgRoot }
          New-Item -ItemType Directory -Path $pkgRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $linksRoot -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $pkgRoot -Force

          $linkedExe = Join-Path $linksRoot "git-tangle-ci.exe"
          if (Test-Path $linkedExe) { Remove-Item -Force $linkedExe }
          New-Item -ItemType HardLink -Path $linkedExe -Target (Join-Path $pkgRoot "git-tangle.exe") | Out-Null

          & $linkedExe --version
          if ($LASTEXITCODE -ne 0) { throw "WinGet Links launcher failed for --version with exit code $LASTEXITCODE" }

          & $linkedExe --help
          if ($LASTEXITCODE -ne 0) { throw "WinGet Links launcher failed for --help with exit code $LASTEXITCODE" }

  publish-release:
    needs:
      - build-artifacts
      - windows-security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
      WINGET_PKGS_FORK: ${{ vars.WINGET_PKGS_FORK }}
    steps:
      - uses: actions/checkout@v4

      - name: Make executables
        run: chmod +x bin/git-tangle libexec/tangle/*.sh scripts/*.sh || true

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Derive version from tag
        id: v
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: git-tangle ${{ steps.v.outputs.tag }}
          files: |
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz.sha256
            dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip
            dist/git-tangle_${{ steps.v.outputs.tag }}_windows_x64.zip.sha256

      - name: Bump Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail

          TAP_REPO="taygunsavas/homebrew-tap"
          FORMULA_PATH="Formula/git-tangle.rb"
          TARBALL_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/git-tangle_${VERSION}.tar.gz"
          SHA256="$(cut -d ' ' -f1 dist/git-tangle_${VERSION}.tar.gz.sha256)"

          tmpdir="$(mktemp -d)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$tmpdir/tap" --depth=1
          cd "$tmpdir/tap"

          mkdir -p Formula
          cat > "$FORMULA_PATH" <<'RUBY'
          class GitTangle < Formula
            desc "A branching workflow tool that untangles your repo"
            homepage "https://github.com/taygunsavas/git-tangle"
            url "__URL__"
            sha256 "__SHA256__"
            license "MIT"

            def install
              bin.install "bin/git-tangle"
              libexec.install "libexec/tangle"
            end
          end
          RUBY

          sed -i.bak -e "s|__URL__|$TARBALL_URL|g" "$FORMULA_PATH"
          sed -i.bak -e "s|__SHA256__|$SHA256|g" "$FORMULA_PATH"
          rm -f "$FORMULA_PATH.bak"

          git config user.name "tangle-bot"
          git config user.email "tangle-bot@users.noreply.github.com"

          git checkout -B "bump/git-tangle-$VERSION"
          git add "$FORMULA_PATH"
          git commit -m "git-tangle $VERSION"
          git push -u origin "bump/git-tangle-$VERSION"

          gh pr create \
            --title "git-tangle $VERSION" \
            --body "Update formula to $VERSION" \
            --head "taygunsavas:bump/git-tangle-$VERSION" \
            --base main 

      - name: Bump winget-pkgs
        if: ${{ env.WINGET_PKGS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.WINGET_PKGS_TOKEN }}
          VERSION: ${{ steps.v.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          FORK_REPO="${WINGET_PKGS_FORK:-${SOURCE_OWNER}/winget-pkgs}"
          FORK_OWNER="${FORK_REPO%%/*}"
          MANIFEST_DIR="manifests/t/taygunsavas/git-tangle/${VERSION}"
          ZIP_SHA256="$(cut -d ' ' -f1 dist/git-tangle_${VERSION}_windows_x64.zip.sha256)"

          tmpdir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git" "$tmpdir/winget-pkgs" --depth=1

          "${GITHUB_WORKSPACE}/scripts/generate-winget-manifests.sh" \
            "$VERSION" \
            "$SOURCE_REPO" \
            "$ZIP_SHA256" \
            "$tmpdir/winget-pkgs"

          cd "$tmpdir/winget-pkgs"
          git config user.name "tangle-bot"
          git config user.email "tangle-bot@users.noreply.github.com"

          git checkout -B "bump/git-tangle-$VERSION"
          git add "$MANIFEST_DIR"
          git commit -m "Add taygunsavas.git-tangle version $VERSION"
          git push -u origin "bump/git-tangle-$VERSION"

          gh pr create \
            --repo microsoft/winget-pkgs \
            --title "New version: taygunsavas.git-tangle version $VERSION" \
            --body "Automated update from ${SOURCE_REPO} release ${VERSION}." \
            --head "${FORK_OWNER}:bump/git-tangle-$VERSION" \
            --base master
