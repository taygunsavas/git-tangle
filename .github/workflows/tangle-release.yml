name: tangle-release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Make executables
        run: chmod +x bin/git-tangle libexec/tangle/*.sh scripts/*.sh || true

      - name: Derive version from tag
        id: v
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package
        run: scripts/package.sh "${{ steps.v.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: git-tangle ${{ steps.v.outputs.tag }}
          files: |
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz
            dist/git-tangle_${{ steps.v.outputs.tag }}.tar.gz.sha256

      - name: Tap bump (Homebrew)
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          TAP_REPO="taygunsavas/homebrew-tap"
          FORMULA_PATH="Formula/git-tangle.rb"
          TARBALL_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/git-tangle_${VERSION}.tar.gz"
          SHA256="$(cut -d ' ' -f1 dist/git-tangle_${VERSION}.tar.gz.sha256)"

          tmpdir=$(mktemp -d)
          gh repo clone "$TAP_REPO" "$tmpdir/tap" -- --depth=1
          cd "$tmpdir/tap"

          mkdir -p Formula
          printf '%s\n' \
            'class GitTangle < Formula' \
            '  desc "A branching workflow tool that untangles your repo"' \
            '  homepage "https://github.com/taygunsavas/git-tangle"' \
            '  url "__URL__"' \
            '  sha256 "__SHA256__"' \
            '  version "__VERSION__"' \
            '  license "MIT"' \
            '' \
            '  def install' \
            '    libexec.install Dir["bin", "libexec", "scripts", ".gitignore", "README.md", "LICENSE", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "SUPPORT.md"]' \
            '    bin.install_symlink libexec/"bin/git-tangle"' \
            '  end' \
            '' \
            '  test do' \
            '    system "#{bin}/git-tangle", "-h"' \
            '  end' \
            'end' > "$FORMULA_PATH"

          sed -i.bak -e "s|__URL__|$TARBALL_URL|g" "$FORMULA_PATH"
          sed -i.bak -e "s|__SHA256__|$SHA256|g" "$FORMULA_PATH"
          sed -i.bak -e "s|__VERSION__|$VERSION|g" "$FORMULA_PATH"
          rm -f "$FORMULA_PATH.bak"

          git config user.name "tangle-bot"
          git config user.email "tangle-bot@users.noreply.github.com"
          git checkout -B "bump/git-tangle-$VERSION"
          git add "$FORMULA_PATH"
          git commit -m "git-tangle $VERSION"
          git push -u origin "bump/git-tangle-$VERSION"
          gh pr create --fill --title "git-tangle $VERSION" --body "Update formula to $VERSION"
